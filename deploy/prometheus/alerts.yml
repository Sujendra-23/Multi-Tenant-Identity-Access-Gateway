# Alert rules for the identity gateway.
#
# Every expression uses only series the gateway exports today (see
# internal/observability/metrics.go) plus Prometheus's own `up`. Nothing here
# depends on a metric that does not exist; things that cannot be alerted on
# because no metric exists are listed in docs/runbooks/login-failure-spike.md.
#
# Thresholds are starting points derived from the code's defaults (login limiter
# 1 req/s per tenant+IP, audit buffer 4096), NOT from observed production
# traffic. Expect to tune them. Check syntax and unit tests with
# scripts/check-alerts.sh. There is no Alertmanager in this repo's compose or
# Kubernetes manifests, so routing and receivers are up to whoever deploys it.
#
# Known gaps in the underlying metrics that shape these rules:
#   * The `tenant` label on gateway_http_requests_total is always "none"
#     (Observe reads the tenant from a request context the handlers never
#     write back to), so HTTP-level alerts are aggregated by route, not tenant.
#     gateway_auth_attempts_total and the login/tenant rate-limit series do
#     carry a real tenant.
#   * gateway_token_verify_failures_total and gateway_active_sessions are
#     registered but never written to, so they are not used.
#   * There are no Postgres or Redis client metrics. Dependency alerts below
#     key off the application's own error outcomes, which are proxies.

groups:
  - name: identity-gateway.availability
    rules:
      - alert: GatewayTargetDown
        # `up` is generated by Prometheus, not by the gateway. It is the only
        # signal left when the gateway is gone, because every other rule here
        # would simply evaluate to "no data".
        expr: up{job="identity-gateway"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gateway {{ $labels.instance }} is not being scraped"
          description: "Prometheus cannot scrape {{ $labels.instance }} (job identity-gateway) for 2 minutes. The process is down, or its metrics listener is unreachable."

      - alert: GatewayNotReady
        # Only observable if something probes /readyz (the Kubernetes readiness
        # probe does). The response body says which of postgres, redis or the
        # signing key failed.
        expr: sum by (instance) (rate(gateway_http_requests_total{route="/readyz", status="503"}[2m])) > 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Gateway {{ $labels.instance }} reports not ready"
          description: "/readyz has been returning 503 on {{ $labels.instance }} for 2 minutes: Postgres, Redis or the signing key is unavailable. Run `curl -s http://<gateway>:8080/readyz` to see which."
          runbook_url: "docs/runbooks/login-failure-spike.md#a-dependency-outage"

      - alert: GatewayHigh5xxRatio
        expr: |
          (
              sum by (route) (rate(gateway_http_requests_total{route!="/readyz", status=~"5.."}[5m]))
            /
              sum by (route) (rate(gateway_http_requests_total{route!="/readyz"}[5m]))
          ) > 0.05
          and
          sum by (route) (rate(gateway_http_requests_total{route!="/readyz"}[5m])) > 0.1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "More than 5% of {{ $labels.route }} requests are failing with 5xx"
          description: "{{ $labels.route }} has returned 5xx for {{ $value | humanizePercentage }} of requests over 5 minutes (and carries more than 0.1 req/s). For /v1/proxy/* these include errors from the upstream service. Distinguish a bad deploy from a dependency outage before acting."
          runbook_url: "docs/runbooks/login-failure-spike.md#triage-what-kind-of-spike-is-this"

      - alert: GatewayHighLatencyP99
        # /v1/proxy/* is excluded because its latency includes the upstream
        # service. The top histogram bucket is 5s, so the quantile cannot read
        # higher than that.
        expr: |
          histogram_quantile(0.99,
            sum by (route, le) (rate(gateway_http_request_duration_seconds_bucket{route!~"/readyz|/v1/proxy/.*"}[5m]))
          ) > 1
          and on (route)
          sum by (route) (rate(gateway_http_request_duration_seconds_count{route!~"/readyz|/v1/proxy/.*"}[5m])) > 0.1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "p99 latency above 1s on {{ $labels.route }}"
          description: "p99 request latency on {{ $labels.route }} has been {{ $value | humanizeDuration }} for 10 minutes. Slow Postgres or Redis calls, CPU starvation or saturation by a login flood are the usual causes."

  - name: identity-gateway.authentication
    rules:
      - alert: GatewayLoginFailureSpike
        # Failed outcomes: wrong password, unknown user, and attempts against
        # a locked account. A tenant is flagged only when failures are both
        # frequent (>0.2/s, about 12 a minute) and the majority of its login
        # attempts, so a busy tenant with a normal failure rate stays quiet.
        expr: |
          sum by (tenant) (rate(gateway_auth_attempts_total{outcome=~"bad_password|unknown_user|locked"}[5m])) > 0.2
          and
          (
              sum by (tenant) (rate(gateway_auth_attempts_total{outcome=~"bad_password|unknown_user|locked"}[5m]))
            /
              sum by (tenant) (rate(gateway_auth_attempts_total[5m]))
          ) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Login failure spike for tenant {{ $labels.tenant }}"
          description: "Tenant {{ $labels.tenant }} is seeing {{ $value | printf `%.2f` }} failed logins per second, most of its login attempts, for 5 minutes. Credential stuffing, a misconfigured client, or a bad deploy that rejects valid credentials."
          runbook_url: "docs/runbooks/login-failure-spike.md"

      - alert: GatewayLoginRateLimitSurge
        # The login limiter allows 1 request/s (burst 5) per tenant+IP by
        # default, so sustained rejections mean one address is hammering the
        # endpoint. A spread-out botnet stays under it and shows up in
        # GatewayLoginFailureSpike instead.
        expr: sum by (tenant) (rate(gateway_rate_limit_rejections_total{dimension="login"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Login rate limiter is rejecting requests for tenant {{ $labels.tenant }}"
          description: "{{ $value | printf `%.2f` }} login requests per second are being rejected by the login rate limiter for tenant {{ $labels.tenant }}. Note the limiter fails open when Redis is unreachable, so silence here during a Redis outage means nothing."
          runbook_url: "docs/runbooks/login-failure-spike.md#mitigations"

      - alert: GatewayRateLimitRejectionsHigh
        # ip/user/tenant dimensions. Fires when a dimension is rejecting more
        # than 1 request/s AND more than 10% of all gateway traffic, which
        # separates a flood from one noisy client.
        expr: |
          sum by (dimension) (rate(gateway_rate_limit_rejections_total{dimension!="login"}[5m])) > 1
          and
          sum by (dimension) (rate(gateway_rate_limit_rejections_total{dimension!="login"}[5m]))
            / scalar(sum(rate(gateway_http_requests_total{route!="/readyz"}[5m]))) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Rate limiter ({{ $labels.dimension }}) is rejecting a large share of traffic"
          description: "The {{ $labels.dimension }} rate limit is rejecting {{ $value | printf `%.2f` }} requests per second, over 10% of all traffic, for 5 minutes. Either an abusive client or limits set too low for real load."
          runbook_url: "docs/runbooks/login-failure-spike.md#mitigations"

      - alert: GatewayRefreshTokenReuseDetected
        # Each detection burns a whole session family. A handful is usually
        # a client retry bug; a cluster is token theft.
        expr: sum(increase(gateway_token_refresh_total{outcome="reuse_detected"}[15m])) >= 5
        labels:
          severity: warning
        annotations:
          summary: "Refresh-token reuse detected {{ $value | humanize }} times in 15 minutes"
          description: "Replayed refresh tokens force the session family to be revoked. Check the audit log for auth.refresh_reuse_detected to see whether it is one user with a buggy client or many users."
          runbook_url: "docs/runbooks/login-failure-spike.md#mitigations"

  - name: identity-gateway.dependencies
    rules:
      - alert: GatewayAuthenticatedRequests503
        # Two code paths answer 503 on authenticated routes: Authenticate when
        # the Redis denylist or session lookup errors (session_check_failed),
        # and RequirePermission when Postgres cannot produce the permission set
        # (authorization_unavailable, which also bumps
        # gateway_authz_decisions_total{decision="error"}). The proxy and the
        # operator endpoints have their own, unrelated 503s and are excluded.
        expr: sum(rate(gateway_http_requests_total{status="503", route!~"/readyz|/v1/proxy/.*|/v1/admin/.*"}[5m])) > 0.05
        for: 3m
        labels:
          severity: critical
        annotations:
          summary: "Authenticated requests are failing with 503"
          description: "Gateway is answering 503 on authenticated routes at {{ $value | printf `%.2f` }} requests per second. Redis session checks or Postgres permission lookups are failing. If gateway_authz_decisions_total{decision=\"error\"} is also rising it is Postgres; if not, Redis."
          runbook_url: "docs/runbooks/login-failure-spike.md#a-dependency-outage"

      - alert: GatewayRefreshRotationErrors
        # outcome="error" is any rotation failure other than not-found, reuse or
        # revoked, which in practice means Redis is erroring.
        expr: sum(rate(gateway_token_refresh_total{outcome="error"}[5m])) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Refresh-token rotation is erroring"
          description: "Refresh requests are failing with an unexpected error ({{ $value | printf `%.2f` }}/s). The rotation script runs in Redis, so check Redis connectivity and errors."
          runbook_url: "docs/runbooks/login-failure-spike.md#a-dependency-outage"

      - alert: GatewayPolicyCacheErrors
        expr: sum(rate(gateway_policy_cache_ops_total{result="error"}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Permission cache reads are erroring"
          description: "Reads of the Redis permission cache are failing at {{ $value | printf `%.2f` }}/s; the gateway falls back to Postgres for each, which adds latency and database load."
          runbook_url: "docs/runbooks/login-failure-spike.md#a-dependency-outage"

      - alert: GatewayAuthzEvaluationFailing
        # decision="error" means the permission set could not be read from
        # Postgres and the request was refused with 503. A Redis cache failure
        # does not land here: it falls back to Postgres (see
        # GatewayPolicyCacheErrors).
        expr: sum(rate(gateway_authz_decisions_total{decision="error"}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Authorization decisions are failing with errors"
          description: "Permission evaluation is erroring ({{ $value | printf `%.2f` }}/s): the effective-permissions query to Postgres is failing, so users are being refused with 503 for infrastructure reasons, not policy."
          runbook_url: "docs/runbooks/login-failure-spike.md#a-dependency-outage"

      - alert: GatewayAuditEventsDropped
        # Counted when the in-memory buffer is full or when a batch write to
        # Postgres fails. The metric's own help text says it should always be 0.
        expr: increase(gateway_audit_events_dropped_total[10m]) > 0
        labels:
          severity: critical
        annotations:
          summary: "Audit events were dropped"
          description: "{{ $value | humanize }} audit events were lost in the last 10 minutes (buffer full or Postgres write failed). The audit chain has a gap for those events."
          runbook_url: "docs/runbooks/login-failure-spike.md#a-dependency-outage"

      - alert: GatewayAuditBufferNearlyFull
        # 3276 is 80% of the default AUDIT_BUFFER_SIZE of 4096. If you change
        # that setting, change this number with it.
        expr: gateway_audit_buffer_depth > 3276
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Audit buffer on {{ $labels.instance }} is above 80% full"
          description: "The audit writer is not keeping up ({{ $value }} events buffered). Events will be dropped once it fills; Postgres is slow or failing, or the event rate has outgrown the buffer."
          runbook_url: "docs/runbooks/login-failure-spike.md#a-dependency-outage"

      - alert: GatewayNoSigningKeys
        expr: gateway_signing_keys < 1
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Gateway {{ $labels.instance }} trusts no signing keys"
          description: "No signing keys are loaded, so access tokens cannot be issued or verified. The key table in Postgres is empty or unreadable."
