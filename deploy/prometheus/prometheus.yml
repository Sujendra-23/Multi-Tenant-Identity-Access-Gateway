# Local docker-compose scrape config. In Kubernetes this is replaced by a
# ServiceMonitor (see deploy/k8s/servicemonitor.yaml) if the Prometheus
# Operator is in use, or an equivalent scrape_config pointed at the gateway's
# ClusterIP service on the metrics port.
global:
  scrape_interval: 10s
  evaluation_interval: 10s

# Alert rules for the gateway; see deploy/prometheus/alerts.yml. This repo does
# not ship an Alertmanager, so firing alerts are visible in the Prometheus UI
# (Alerts tab) but are not routed anywhere until one is configured.
rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: identity-gateway
    static_configs:
      - targets: ["gateway:9090"]
        labels:
          service: identity-gateway

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
