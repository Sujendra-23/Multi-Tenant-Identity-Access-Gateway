# Single-instance Redis for demonstration purposes. Losing this loses every
# live session, refresh token and rate-limit bucket — inconvenient (every user
# has to log in again) but not a correctness problem, since Postgres remains
# the source of truth for tenant data. In FEATURE_FLAGS_BACKEND=redis mode,
# losing this keyspace also loses the shared flag configuration; emptyDir does
# not survive pod replacement. Use persistent storage/backups for shared flags.
# A real deployment should run
# Redis with replication/Sentinel or use a managed equivalent (ElastiCache,
# MemoryStore) for availability.
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: identity-gateway
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: identity-gateway
spec:
  replicas: 1
  selector: { matchLabels: { app: redis } }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--requirepass", "$(REDIS_PASSWORD)", "--appendonly", "yes"]
          ports: [{ containerPort: 6379 }]
          env:
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: identity-gateway-secrets, key: REDIS_PASSWORD } }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"] }
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
      volumes:
        - name: data
          emptyDir: {}
