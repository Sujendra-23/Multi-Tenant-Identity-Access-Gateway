# Template only — DO NOT commit real values. Copy to 01-secrets.yaml (already
# gitignored via deploy/k8s/*.secrets.yaml being out of scope of this example)
# and fill in real, generated secrets, or better, manage this via your
# platform's secret store (AWS Secrets Manager + External Secrets Operator,
# Sealed Secrets, SOPS, etc.) rather than applying raw Secret manifests by hand.
#
# Generate strong values with, e.g.:
#   openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: identity-gateway-secrets
  namespace: identity-gateway
type: Opaque
stringData:
  # Bootstrap (superuser) Postgres credentials — used only by the postgres
  # StatefulSet's own init, never by the gateway. See 03-postgres.yaml and
  # deploy/postgres-init/01-app-role.sh for why that separation matters: the
  # bootstrap role is a superuser and superusers silently bypass every
  # row-level-security policy this project's tenant isolation depends on.
  POSTGRES_USER: "postgres_bootstrap"
  POSTGRES_PASSWORD: "REPLACE_ME"
  POSTGRES_DB: "gateway"

  # The gateway's own, restricted, non-superuser role.
  GATEWAY_APP_PASSWORD: "REPLACE_ME"

  REDIS_PASSWORD: "REPLACE_ME"

  # Shared secret for POST /v1/admin/tenants.
  BOOTSTRAP_KEY: "REPLACE_ME"
