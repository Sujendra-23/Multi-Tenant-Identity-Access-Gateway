apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: identity-gateway
  labels: { app: gateway }
spec:
  selector: { app: gateway }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
    - { name: metrics, port: 9090, targetPort: 9090 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: identity-gateway
  labels: { app: gateway }
spec:
  replicas: 3
  selector: { matchLabels: { app: gateway } }
  template:
    metadata:
      labels: { app: gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      # Every replica applies migrations and re-checks VerifyRLSEnforceable at
      # startup (see internal/store/postgres/db.go); migrations are idempotent
      # (CREATE TABLE IF NOT EXISTS, ON CONFLICT DO NOTHING throughout), so
      # concurrent application across replicas during a rolling update is safe.
      securityContext:
        runAsNonRoot: true
        # The distroless nonroot base image (see Dockerfile) sets USER
        # nonroot:nonroot, a name rather than a bare digit in the image's own
        # config. Some kubelet versions cannot resolve that name to verify
        # runAsNonRoot on their own and fail the pod outright ("cannot verify
        # user is non-root") rather than assume — so the UID distroless
        # documents for "nonroot" (65532) is pinned explicitly here instead of
        # relying on the image default being resolvable.
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: identity-gateway-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 8080 }
            - { name: metrics, containerPort: 9090 }
          envFrom:
            - configMapRef: { name: identity-gateway-config }
          # Order matters here and is not cosmetic: Kubernetes expands a
          # $(VAR_NAME) reference inside one env[].value using only the
          # variables already defined *earlier* in this same list (unlike
          # command/args, which see the fully-resolved env and so are not
          # order-sensitive). POSTGRES_DB and GATEWAY_APP_PASSWORD must
          # therefore come before POSTGRES_DSN, or the reference is left as
          # the literal, unexpanded text "$(POSTGRES_DB)" and the gateway
          # fails to connect to Postgres at all.
          env:
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: identity-gateway-secrets, key: POSTGRES_DB } }
            - name: GATEWAY_APP_PASSWORD
              valueFrom: { secretKeyRef: { name: identity-gateway-secrets, key: GATEWAY_APP_PASSWORD } }
            - name: POSTGRES_DSN
              value: "postgres://gateway_app:$(GATEWAY_APP_PASSWORD)@postgres:5432/$(POSTGRES_DB)?sslmode=disable"
            - name: REDIS_PASSWORD
              valueFrom: { secretKeyRef: { name: identity-gateway-secrets, key: REDIS_PASSWORD } }
            - name: BOOTSTRAP_KEY
              valueFrom: { secretKeyRef: { name: identity-gateway-secrets, key: BOOTSTRAP_KEY } }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gateway
  namespace: identity-gateway
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: gateway }
  minReplicas: 3
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 70 } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gateway
  namespace: identity-gateway
spec:
  minAvailable: 2
  selector: { matchLabels: { app: gateway } }
