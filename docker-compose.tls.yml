# TLS overlay: HTTPS on the public API and mutual TLS from the gateway to the
# upstream. Generate the dev PKI first, then:
#
#   ./scripts/gen-dev-certs.sh
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d --build
#   CURL_CA_BUNDLE=deploy/tls/dev/ca.pem BASE_URL=https://localhost:8443 \
#     EXPECT_UPSTREAM_MTLS=1 ./scripts/smoke-test.sh
services:
  gateway:
    environment:
      TLS_CERT_FILE: /tls/gateway.pem
      TLS_KEY_FILE: /tls/gateway-key.pem
      UPSTREAMS: "demo=https://upstream:8443"
      UPSTREAM_CA_FILE: /tls/ca.pem
      UPSTREAM_CLIENT_CERT_FILE: /tls/gateway-client.pem
      UPSTREAM_CLIENT_KEY_FILE: /tls/gateway-client-key.pem
    volumes:
      - ./deploy/tls/dev:/tls:ro
    ports: !override
      - "127.0.0.1:8443:8080"
      - "127.0.0.1:9090:9090"

  upstream:
    environment:
      ADDR: ":8443"
      TLS_CERT_FILE: /tls/upstream.pem
      TLS_KEY_FILE: /tls/upstream-key.pem
      TLS_CLIENT_CA_FILE: /tls/ca.pem
      GATEWAY_JWKS_URL: "https://gateway:8080/.well-known/jwks.json"
      GATEWAY_CA_FILE: /tls/ca.pem
    volumes:
      - ./deploy/tls/dev:/tls:ro
